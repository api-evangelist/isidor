name: Isidor
description: Isidor is a frontier enterprise-AI company, founded in 2025 and headquartered
  in San Francisco with a London presence, building secure, vertically-integrated data
  pipelines that transform unstructured proprietary enterprise data into training- and
  evaluation-ready material for foundation models. Its platform spans five capabilities
  it describes as evaluation (industry-specific and agentic benchmarks), verifiers for
  generative-AI outputs in critical workflows, reasoning-trace data capture, foundation-model
  post-training (fine-tuning and alignment on proprietary data), and enterprise-grade
  security and privacy. Isidor raised an oversubscribed $3.6M pre-seed led by Gradient
  Ventures, futurepresent, and Seedcamp, with angels from Google DeepMind, Perplexity,
  and others. The company has no public API or developer surface yet; this profile tracks
  it as an enrichment lead in the API Evangelist network.
